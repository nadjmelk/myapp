<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(120deg, #2980b9, #6dd5fa); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; border: none; background: #3498db; color: white; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
        a { display: block; margin-top: 10px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="رقم الهاتف أو الإيميل"><br>
        <input type="password" id="password" placeholder="كلمة السر"><br>
        <button onclick="login()">دخول</button>
        <a href="register.html">إنشاء حساب جديد</a>
        <a href="reset.html">نسيت كلمة السر؟</a>
    </div>

    <script>
        function login() {
            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;

            var storedUser = localStorage.getItem('username');
            var storedPass = localStorage.getItem('password');

            if (user === storedUser && pass === storedPass) {
                alert('تم الدخول بنجاح!');
                window.location.href = 'home.html';
            } else {
                alert('اسم المستخدم أو كلمة السر خاطئة!');
            }
        }
    </script>
</body>
</html>
